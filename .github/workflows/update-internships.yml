name: Update Internship Listings

on:
  schedule:
    # Every six hours (UTC). GitHub may delay scheduled runs during busy periods.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-internship-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update internship listings
        run: python scripts/fetch_internships.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/internships.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh internship listings"
            git push
          else
            echo "No changes to commit."
          fi
